services:
  app_php:
    container_name: app-php
    image: lincenying/app-php:${TAG}
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - app-network
    depends_on:
      - mysql_db_php
    environment:
      DB_HOST: mysql_db_php
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-database_name}
      DB_USERNAME: ${MYSQL_USER:-MYSQL_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-MYSQL_password}
    env_file:
      - .env

  nginx_php:
    container_name: nginx-php
    image: lincenying/nginx-php:${TAG}
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "8084:80"
    networks:
      - app-network
    depends_on:
      - app_php

  mysql_db_php:
    container_name: mysql-db-php
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-database_name}
      MYSQL_USER: ${MYSQL_USER:-MYSQL_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-MYSQL_password}
    ports:
      - "3306:3306"
    volumes:
      - ./app/mysql.sql:/home/mysql/mysql.sql
      - ${MYSQL_DIR:-./data/mysqldb}:/var/lib/mysql
    networks:
      - app-network

volumes:
  php-mysql-data:
    driver: local

networks:
  app-network:
    driver: bridge
